        font-size: 46px;
        font-weight: 400;
        letter-spacing: 0.07em;
        fill: #14110e;
      }
      .gt-sub {
        font-family: 'Archivo', -apple-system, sans-serif;
        font-size: 9px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        font-weight: 600;
        fill: #7a7162;
      }
